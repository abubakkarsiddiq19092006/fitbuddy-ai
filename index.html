<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitBuddy - AI Fitness Planner</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: #1f7a4d;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 16px;
      opacity: 0.9;
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: 30px auto;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .card h2 {
      margin-bottom: 10px;
      color: #1f7a4d;
    }

    .card p {
      margin-bottom: 20px;
      color: #555;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #1f7a4d;
    }

    button {
      margin-top: 15px;
      width: 100%;
      padding: 15px;
      background: #1f7a4d;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #17623d;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #loading {
      display: none;
      margin-top: 20px;
      text-align: center;
      color: #1f7a4d;
      font-weight: bold;
    }

    #result {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #f0f8f4;
      border-left: 5px solid #1f7a4d;
      border-radius: 10px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    #error {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #ffecec;
      color: #b00020;
      border-radius: 10px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 26px;
      }

      .container {
        width: 94%;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>💪 FitBuddy</h1>
    <p>Your AI-powered fitness planning assistant</p>
  </header>

  <main class="container">

    <div class="card">
      <h2>Create Your Fitness Plan</h2>

      <p>
        Tell FitBuddy about your fitness goal, experience level,
        available equipment, and schedule.
      </p>

      <textarea
        id="message"
        placeholder="Example: I am a beginner. I want to lose weight and exercise at home 5 days a week. Create a workout plan for me."
      ></textarea>

      <button id="generateBtn" onclick="generatePlan()">
        Generate Fitness Plan
      </button>

      <div id="loading">
        Creating your personalized fitness plan...
      </div>

      <div id="error"></div>

      <div id="result"></div>
    </div>

  </main>

  <footer>
    FitBuddy provides general educational fitness guidance.
  </footer>

  <script>
    async function generatePlan() {
      const messageInput = document.getElementById("message");
      const button = document.getElementById("generateBtn");
      const loading = document.getElementById("loading");
      const result = document.getElementById("result");
      const error = document.getElementById("error");

      const message = messageInput.value.trim();

      // Clear previous messages
      result.style.display = "none";
      error.style.display = "none";
      result.textContent = "";
      error.textContent = "";

      if (!message) {
        error.textContent = "Please enter your fitness goal first.";
        error.style.display = "block";
        return;
      }

      button.disabled = true;
      loading.style.display = "block";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        });

        // Read the response as text first.
        // This prevents the "Unexpected token '<'" error
        // from hiding the real server response.
        const responseText = await response.text();

        let data;

        try {
          data = JSON.parse(responseText);
        } catch (jsonError) {
          throw new Error(
            "The server returned an invalid response: " +
            responseText.substring(0, 200)
          );
        }

        if (!response.ok) {
          throw new Error(data.error || "Unable to generate the plan.");
        }

        if (!data.reply) {
          throw new Error("The AI returned an empty response.");
        }

        result.textContent = data.reply;
        result.style.display = "block";

      } catch (err) {
        console.error("FitBuddy error:", err);

        error.textContent =
          "Unable to generate the plan. " + err.message;

        error.style.display = "block";

      } finally {
        button.disabled = false;
        loading.style.display = "none";
      }
    }
  </script>

</body>
</html>
